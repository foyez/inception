<svg width="680" height="460" viewBox="0 0 680 460" xmlns="http://www.w3.org/2000/svg" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Inception request flow</title>
<desc>Browser connects to NGINX over HTTPS, NGINX forwards PHP requests to WordPress over FastCGI, WordPress queries MariaDB over the internal network.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#3d3d3a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect width="680" height="460" fill="#ffffff"/>

<g>
<rect x="210" y="30" width="260" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="52" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Browser</text>
</g>

<line x1="340" y1="74" x2="340" y2="108" stroke="#3d3d3a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="480" y="96" font-family="sans-serif" font-size="12" fill="#5F5E5A">443, TLS 1.2/1.3</text>

<g>
<rect x="210" y="108" width="260" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="128" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#042C53">nginx</text>
<text x="340" y="148" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0C447C">TLS termination, static root</text>
</g>

<line x1="340" y1="164" x2="340" y2="198" stroke="#3d3d3a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="480" y="186" font-family="sans-serif" font-size="12" fill="#5F5E5A">fastcgi :9000</text>

<g>
<rect x="210" y="198" width="260" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="218" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">wordpress</text>
<text x="340" y="238" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">php-fpm, wp-cli</text>
</g>

<line x1="340" y1="254" x2="340" y2="288" stroke="#3d3d3a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="480" y="276" font-family="sans-serif" font-size="12" fill="#5F5E5A">mysql :3306</text>

<g>
<rect x="210" y="288" width="260" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="308" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">mariadb</text>
<text x="340" y="328" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">database engine</text>
</g>

<rect x="140" y="98" width="400" height="256" rx="20" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="4 4"/>
<text x="160" y="386" font-family="sans-serif" font-size="12" fill="#5F5E5A">Docker bridge network "inception" (only nginx publishes a host port)</text>

<text x="160" y="410" font-family="sans-serif" font-size="12" fill="#5F5E5A">wp_data volume: shared by nginx and wordpress → /home/login/data/wordpress</text>
<text x="160" y="428" font-family="sans-serif" font-size="12" fill="#5F5E5A">db_data volume: mariadb only → /home/login/data/db</text>
</svg>
