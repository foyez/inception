server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;

  server_name kaahmed.42.fr;

  ssl_certificate     /etc/nginx/ssl/kaahmed.crt;
  ssl_certificate_key /etc/nginx/ssl/kaahmed.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;

  root /var/www/html;
  index index.php;

  location / {
    try_files $uri $uri/ /index.php?$args;
  }

  location ~ \.php$ {
    fastcgi_pass wordpress:9000;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    include fastcgi_params;
  }
}